<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лапа · Чат с салоном</title>
<style>
:root{font:16px system-ui,sans-serif;color:#163b30;background:#f3f4eb} *{box-sizing:border-box}body{margin:0}
header{background:#183f34;color:white;padding:20px max(22px,calc((100% - 760px)/2));font-size:20px;font-weight:700}
main{width:min(760px,calc(100% - 38px));margin:32px auto} h1{font-size:clamp(30px,5vw,48px);margin:0 0 8px;letter-spacing:-.04em}
p{line-height:1.5}.sub{color:#486257;margin:0 0 24px}.chat{min-height:235px;background:white;border:1px solid #d8e0d5;border-radius:18px;padding:20px;display:grid;align-content:start;gap:12px}
.msg{margin:0;max-width:91%;padding:12px 15px;border-radius:13px;background:#e8efe5;white-space:pre-wrap;overflow-wrap:anywhere}.mine{justify-self:end;background:#d9edaa}.error{color:#8b271c;background:#fde7df}
form{margin-top:16px;display:grid;gap:9px}label{font-weight:700}textarea{font:inherit;padding:12px;border:1px solid #bdcebf;border-radius:10px;resize:vertical;min-height:90px;color:inherit}
button{justify-self:end;color:white;background:#245843;border:0;border-radius:10px;padding:11px 19px;font:700 16px system-ui;cursor:pointer}button:disabled{opacity:.6;cursor:wait}
small{color:#486257}
</style></head>
<body><header>Лапа · Груминг-салон</header>
<main>
<h1>Чат с салоном</h1>
<p class="sub">Спросите о стрижке, гигиеническом комплексе или экспресс-линьке.</p>
<section id="chat" class="chat" role="log" aria-label="Сообщения" aria-live="polite">
<p class="msg">Здравствуйте! Чем можем помочь?</p>
</section>
<form id="ask"><label for="message">Ваш вопрос</label>
<textarea id="message" name="message" required minlength="5" maxlength="700" placeholder="Например: что входит в полный комплекс?"></textarea>
<button type="submit">Отправить</button></form>
<small>Учебный салон. Чат подсказывает по услугам, запись подтверждает администратор.</small>
</main><script>
const form = document.getElementById('ask');
const input = document.getElementById('message');
const button = form.querySelector('button');
const chat = document.getElementById('chat');
function bubble(text, style = '') {
  const line = document.createElement('p');
  line.className = 'msg ' + style;
  line.textContent = text;
  chat.append(line);
  return line;
}
form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const message = input.value.trim();
  button.disabled = true;
  bubble(message, 'mine');
  const pending = bubble('Готовим ответ…');
  input.value = '';
  try {
    const response = await fetch('/ask', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});
    const data = await response.json();
    if (!response.ok || !data.answer) throw new Error(data.error || 'Ответ не получен.');
    pending.textContent = data.answer;
    if (data.model) pending.setAttribute('title', data.model);
  } catch (error) {
    pending.textContent = error.message;
    pending.classList.add('error');
  } finally {
    button.disabled = false;
    pending.scrollIntoView({block:'nearest'});
  }
});
</script></body></html>
